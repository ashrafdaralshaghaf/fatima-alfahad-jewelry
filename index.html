<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fatima Alfahad Jewelry</title>
<meta name="description" content="Fine jewelry in 18K gold and lab-grown diamonds, designed in Kuwait.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout concept: a jewel case. Ivory salon pages alternate with deep-green velvet spreads;
   the octagon of the mark becomes the frame language (chamfered "facet" corners), gold is foil, used sparingly. */
:root{
  --green:#183028;            /* Pantone 5535C, primary */
  --green-deep:#0f201a;
  --sage:#5f7361;             /* primary 2 */
  --gold:#b69262;             /* secondary */
  --gold-light:#f2d48e;       /* secondary */
  --foil:linear-gradient(100deg,#9c7b4c 0%,#b69262 22%,#f2d48e 46%,#e2c483 54%,#b69262 74%,#9c7b4c 100%);
  --ivory:#0e1d17;            /* page ground: deepest brand green */
  --stone:#162a21;            /* raised panels */
  --ink:#c9a66e;              /* champagne gold text */
  --muted:rgba(201,166,110,.75);
  --line:rgba(201,166,110,.16);
  --on-dark:#c9a66e;
  --on-dark-muted:rgba(201,166,110,.75);
  --line-dark:rgba(201,166,110,.2);

  --f-display:"Cormorant Garamond","Iowan Old Style","Times New Roman",serif;
  --f-ui:"Jost","Helvetica Neue",Arial,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --track:.2em;

  --gutter:clamp(16px,4.2vw,64px);
  --maxw:1440px;
  --hh:78px;
  --ease:cubic-bezier(.2,.7,.1,1);
  --c:14px;
  color-scheme:dark;
}
:root[lang="ar"]{ --f-display:var(--f-ar); --f-ui:var(--f-ar); --track:0; }

@property --mx{syntax:"<percentage>";inherits:true;initial-value:50%}
@property --my{syntax:"<percentage>";inherits:true;initial-value:40%}
@property --foilx{syntax:"<percentage>";inherits:true;initial-value:0%}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ivory);color:var(--ink);font-family:var(--f-ui);font-weight:300;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
:root[lang="ar"] body{font-size:15.5px;line-height:1.85}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}
h1,h2,h3,h4{margin:0;font-weight:300;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:400;letter-spacing:var(--track);text-transform:uppercase;color:var(--gold)}
:root[lang="ar"] .eyebrow{font-size:13px;font-weight:400}
.display{font-family:var(--f-display);font-weight:300;line-height:1.02;letter-spacing:-.01em}
:root[lang="ar"] .display{font-weight:200;line-height:1.3;letter-spacing:0}
.it{font-style:italic}
:root[lang="ar"] .it{font-style:normal}
.foil{background:var(--foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 7s ease-in-out infinite}
@keyframes foil{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.flip-rtl{display:inline-block}
:root[dir="rtl"] .flip-rtl{transform:scaleX(-1)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.2;flex:none}

/* buttons */
.btn{--bg:transparent;--fg:var(--ink);box-shadow:inset 0 0 0 1px rgba(201,166,110,.6);transition:color .4s var(--ease),translate .4s var(--ease)!important;display:inline-flex;align-items:center;justify-content:center;gap:.8em;min-height:52px;padding:0 30px;background:var(--bg);color:var(--fg);font-size:11.5px;font-weight:400;letter-spacing:var(--track);text-transform:uppercase;position:relative;overflow:hidden;isolation:isolate;transition:color .4s var(--ease)}
:root[lang="ar"] .btn{font-size:14px}
.btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:var(--o,left);transition:transform .6s var(--ease);z-index:-1}
:root[dir="rtl"] .btn{--o:right}
.btn:hover::before{transform:scaleX(1)}
.btn:hover{color:var(--green-deep)}
.btn.light{--bg:transparent;--fg:var(--ink)}
.btn.ghost{--bg:transparent;--fg:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.btn.block{width:100%}
.link{display:inline-flex;align-items:center;gap:.7em;font-size:11.5px;font-weight:400;letter-spacing:var(--track);text-transform:uppercase;padding-block:6px;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;transition:background-size .5s var(--ease)}
:root[lang="ar"] .link{font-size:14px}
.link:hover{background-size:30% 1px}
:root[dir="rtl"] .link{background-position:100% 100%}

/* facet frames — the octagon of the mark */
.facet{clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.octagon{clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%)}

/* brand mark (raster masks from the guideline, recoloured in CSS) */
.mk{display:block;aspect-ratio:600/739;background:currentColor;-webkit-mask:url(a/mark.png) center/contain no-repeat;mask:url(a/mark.png) center/contain no-repeat}
.wm{display:block;aspect-ratio:1220/175;background:currentColor;-webkit-mask:url(a/wordmark.png) center/contain no-repeat;mask:url(a/wordmark.png) center/contain no-repeat}
:root[lang="ar"] .wm{aspect-ratio:1000/164;-webkit-mask-image:url(a/wordmark-ar.png);mask-image:url(a/wordmark-ar.png)}
.gold-mk{background:var(--foil);background-size:250% 100%;animation:foil 6s ease-in-out infinite}

/* ---------- announcement ---------- */
.announce{background:var(--green-deep);color:var(--on-dark);text-align:center;font-size:10.5px;letter-spacing:var(--track);text-transform:uppercase;padding:9px var(--gutter);min-height:36px;display:grid;place-items:center}
:root[lang="ar"] .announce{font-size:13px}
.announce span{transition:opacity .5s,transform .5s var(--ease)}
.announce span.out{opacity:0;transform:translateY(-6px)}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--hh);color:var(--ink);transition:background .5s,color .5s,box-shadow .5s,backdrop-filter .5s}
.hdr::after{content:"";position:absolute;inset:0;background:rgba(14,29,23,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 1px 0 var(--line);z-index:-1;transition:opacity .5s}
body.over-hero:not(.scrolled) .hdr{color:var(--on-dark)}
body.over-hero:not(.scrolled) .hdr::after{opacity:0}
.hdr .wrap{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:clamp(10px,2vw,26px)}
.hdr-r{justify-content:flex-end}
.hdr-btn{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:var(--track);text-transform:uppercase;font-weight:400;min-height:44px;position:relative}
:root[lang="ar"] .hdr-btn{font-size:13.5px}
.hdr-nav{display:none;gap:28px}
.hdr-nav a{font-size:11px;letter-spacing:var(--track);text-transform:uppercase;font-weight:400;padding-block:8px;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .4s var(--ease)}
:root[lang="ar"] .hdr-nav a{font-size:13.5px}
.hdr-nav a:hover{background-size:100% 1px}
.brand{display:flex;align-items:center;gap:14px;color:var(--ink);transition:color .5s}
body.over-hero:not(.scrolled) .brand{color:var(--on-dark)}
.brand .mk{height:56px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
@media (min-width:1000px){.brand .mk{height:64px}}
.brand .wm{height:13px;display:none}
:root[lang="ar"] .brand .wm{height:22px}
.count{font-variant-numeric:tabular-nums;color:var(--gold)}
.hdr-lbl{display:none}
.dot{position:absolute;top:8px;inset-inline-end:-6px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
@media (min-width:1000px){
  :root{--hh:92px}
  .hdr-nav{display:flex}
  .brand .wm{display:block}
  .hdr-lbl{display:inline}
}

/* ---------- hero ---------- */
.hero{position:relative;margin-top:calc(-1 * var(--hh));height:clamp(600px,94svh,960px);color:var(--on-dark);background:var(--green);overflow:hidden;isolation:isolate}
.hero-media{position:absolute;inset:0;z-index:-1}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:72% 30%;animation:heroIn 2.6s var(--d,0s) var(--ease) both;transition:translate 1.2s var(--ease)}
:root[dir="rtl"] .hero-media img{transform:scaleX(-1);animation-name:heroInR}
@keyframes heroIn{from{scale:1.12;filter:brightness(.6)}to{scale:1;filter:none}}
@keyframes heroInR{from{scale:1.12;filter:brightness(.6)}to{scale:1;filter:none}}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,.12) 40%,rgba(0,0,0,0) 65%),linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,0) 22%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-copy{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:26px;padding-block:calc(var(--hh) + 24px) clamp(40px,7vh,88px)}
.hero h1{font-size:clamp(42px,5.2vw,86px);color:#d0ad74}
:root[lang="ar"] .hero h1{font-size:clamp(36px,4.4vw,72px)}
.hero h1 .ln{display:block;padding-bottom:.04em}
.hero h1 .w{display:inline-block;white-space:nowrap}
.hero h1 .ch{display:inline-block;animation:chIn 1.2s var(--ease) both;animation-delay:calc(var(--d,0s) + var(--i) * 32ms)}
.hero h1 .ch.g{padding-inline-end:.02em}
@keyframes chIn{from{opacity:0;transform:translateY(55%) rotate(7deg);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero .lede{max-width:40ch;color:var(--on-dark-muted);font-size:15.5px;animation:fadeUp 1.2s calc(var(--d,0s) + .9s) var(--ease) both}
.hero .eyebrow{animation:fadeUp 1.2s var(--d,0s) var(--ease) both}
.hero .ctas{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;animation:fadeUp 1s calc(var(--d,0s) + .45s) var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:899px){
  .hero{height:min(84svh,740px)}
  .hero-media img{object-position:80% 30%}
  .hero-copy{padding-block:0 40px;gap:20px}
}
.hero-mark{position:absolute;inset-inline-end:var(--gutter);bottom:clamp(40px,7vh,88px);width:54px;display:none}
.scroll-cue{display:none}
@media (min-width:900px){
  .hero-media::after{background:linear-gradient(90deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 45%),linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0) 20%)}
  :root[dir="rtl"] .hero-media::after{background:linear-gradient(-90deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 45%),linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0) 20%)}
  .hero-media img{object-position:62% 30%}
  .hero-copy{justify-content:center;max-width:var(--maxw)}
  .hero-copy>*{max-width:min(44%,600px)}
  .hero-copy>h1{max-width:min(58%,820px)}
  .hero-media::before{content:"";position:absolute;inset:0 0 auto;height:200px;background:linear-gradient(rgba(15,32,26,.5),rgba(15,32,26,0));z-index:1}
  .hero-mark{display:block}
}

/* scroll-driven motion (progressive) */
@supports (animation-timeline:view()){
  @media (prefers-reduced-motion:no-preference){
    .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
    @keyframes rv{from{transform:translateY(48px)}to{transform:none}}
    .rv-img{animation:rvImg linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
    @keyframes rvImg{from{clip-path:inset(7% 7% 7% 7%)}to{clip-path:inset(0 0 0 0)}}
    @media (min-width:900px){.hero-media{animation:par linear both;animation-timeline:scroll(root);animation-range:0 100vh}}
    @keyframes par{to{transform:translateY(18%)}}
  }
}

/* ---------- sections ---------- */
section{position:relative}
.pad{padding-block:clamp(72px,11vw,160px)}
.dark{background:var(--green);color:var(--on-dark)}
.dark .muted{color:var(--on-dark-muted)}
.muted{color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,56px)}
.sec-head h2{font-size:clamp(34px,4.4vw,64px)}
:root[lang="ar"] .sec-head h2{font-size:clamp(30px,3.6vw,52px)}
.sec-head .eyebrow{display:block;margin-bottom:16px}

/* manifesto */
.manifesto{text-align:center;overflow:hidden}
.manifesto .wm-bg{position:absolute;left:50%;top:50%;width:min(560px,80vw);translate:-50% -50%;color:var(--gold);opacity:.06;pointer-events:none}
.manifesto h2{font-size:clamp(40px,6.4vw,104px);max-width:14ch;margin-inline:auto}
:root[lang="ar"] .manifesto h2{font-size:clamp(34px,5vw,80px)}
.manifesto p{max-width:58ch;margin:32px auto 36px;color:var(--muted);font-size:16px}
.manifesto .eyebrow{display:block;margin-bottom:28px}

/* collections */
.cols{display:grid;gap:clamp(16px,2vw,28px);grid-template-columns:1fr}
.col-card{display:grid;gap:22px;color:inherit}
.col-card .media{aspect-ratio:4/5;overflow:hidden;background:var(--stone);--c:22px}
.col-card img{width:100%;height:100%;object-fit:cover;transition:scale 1.4s var(--ease)}
.col-card:hover img{scale:1.05}
.col-card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.col-card h3{font-family:var(--f-display);font-size:clamp(28px,2.6vw,38px)}
.col-card p{color:var(--muted)}
.col-card .num{font-size:11px;letter-spacing:var(--track);color:var(--gold);font-variant-numeric:tabular-nums}
@media (min-width:760px){.cols{grid-template-columns:repeat(3,1fr)}.col-card:nth-child(2){margin-top:clamp(40px,8vw,120px)}}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,3vw,48px) clamp(12px,2vw,28px)}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;display:grid;gap:16px;min-width:0}
.card-media{display:block;aspect-ratio:4/5;background:var(--stone);overflow:hidden;--c:12px;transform-style:preserve-3d;transition:transform .5s var(--ease)}
.card-media img{width:100%;height:100%;object-fit:cover;transition:scale 1.2s var(--ease)}
.card:hover .card-media img{scale:1.06}
.card-media .glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,248,226,.35),transparent 45%);opacity:0;transition:opacity .4s;pointer-events:none;mix-blend-mode:soft-light}
.card:hover .glare{opacity:1}
.card-meta{display:grid;gap:4px;min-width:0}
.card h3{font-family:var(--f-display);font-size:clamp(19px,1.6vw,23px);font-weight:400;line-height:1.2}
:root[lang="ar"] .card h3{font-size:clamp(16px,1.3vw,18px);font-weight:300}
.price{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tag{position:absolute;top:14px;inset-inline-start:14px;font-size:10px;letter-spacing:var(--track);text-transform:uppercase;color:var(--gold-light);background:rgba(14,29,23,.72);padding:5px 10px;backdrop-filter:blur(6px)}
:root[lang="ar"] .tag{font-size:12px}
.wish{position:absolute;top:8px;inset-inline-end:8px;width:42px;height:42px;display:grid;place-items:center;color:var(--green);z-index:2}
.wish svg{width:19px;height:19px;stroke:currentColor;fill:transparent;stroke-width:1.2;transition:fill .3s,transform .4s var(--ease)}
.wish[aria-pressed="true"] svg{fill:var(--green);transform:scale(1.1)}
.dark .wish{color:var(--green)}

/* rail */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:72%;gap:clamp(12px,2vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:var(--gutter);scroll-padding-inline:var(--gutter);overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
@media (min-width:700px){.rail{grid-auto-columns:40%}}
@media (min-width:1100px){.rail{grid-auto-columns:calc((min(100vw,var(--maxw)) - 2*var(--gutter) - 3*28px)/4)}}
.rail-ctrl{display:flex;gap:10px;align-items:center}
.circ{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s,translate .4s var(--ease)}
.circ:hover{background:var(--gold-light);color:var(--green-deep);border-color:var(--gold-light)}
.dark .circ{border-color:var(--line-dark)}
.progress{height:1px;background:var(--line);margin:40px var(--gutter) 0;position:relative;max-width:calc(var(--maxw) - 2*var(--gutter))}
.progress i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--p,20%);background:var(--gold-light);transition:width .2s}

/* light the stone */
.lume-sec .wrap{display:grid;gap:clamp(40px,6vw,96px);align-items:center}
@media (min-width:900px){.lume-sec .wrap{grid-template-columns:1.05fr 1fr}}
.lume{position:relative;aspect-ratio:1;max-width:620px;width:100%;margin-inline:auto;cursor:crosshair;touch-action:pan-y;--mx:50%;--my:40%}
.lume .frame{position:absolute;inset:0;overflow:hidden;background:var(--stone)}
.lume img{width:100%;height:100%;object-fit:cover;scale:1.04;transition:scale 1s var(--ease)}
.lume:hover img{scale:1.1}
.lume .frame::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,250,232,.9) 0%,rgba(255,244,214,.35) 9%,transparent 30%);mix-blend-mode:soft-light;pointer-events:none}
.lume .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),transparent 18%,rgba(15,32,26,.35) 70%);pointer-events:none;z-index:1}
.lume.idle{animation:wander 9s ease-in-out infinite}
@keyframes wander{0%{--mx:38%;--my:30%}33%{--mx:62%;--my:42%}66%{--mx:46%;--my:62%}100%{--mx:38%;--my:30%}}
.lume .ring-line{position:absolute;inset:-16px;background:rgba(182,146,98,.6)}
.lume .ring-line::after{content:"";position:absolute;inset:1px;background:var(--green);clip-path:inherit}
.lume-copy h2{font-size:clamp(34px,4.2vw,60px);margin-block:18px 22px}
:root[lang="ar"] .lume-copy h2{font-size:clamp(28px,3.4vw,48px)}
.lume-copy p{max-width:48ch}
.specs{margin:36px 0 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line-dark)}
.specs div{padding:16px 0;border-bottom:1px solid var(--line-dark);display:grid;gap:2px}
.specs div:nth-child(odd){padding-inline-end:16px}
.specs dt{font-size:10.5px;letter-spacing:var(--track);text-transform:uppercase;color:var(--gold)}
:root[lang="ar"] .specs dt{font-size:12.5px}
.specs dd{margin:0;font-family:var(--f-display);font-size:20px}
:root[lang="ar"] .specs dd{font-size:16px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,28px)}
.cat{display:grid;gap:14px;text-align:center}
.cat .media{aspect-ratio:3/4;overflow:hidden;background:var(--stone)}
.cat img{width:100%;height:100%;object-fit:cover;transition:scale 1.2s var(--ease)}
.cat:hover img{scale:1.06}
.cat span{font-family:var(--f-display);font-size:clamp(18px,2.2vw,30px)}

/* gifting */
.gift .wrap{display:grid;gap:clamp(36px,5vw,80px);align-items:center}
@media (min-width:900px){.gift .wrap{grid-template-columns:1fr 1fr}.gift .gift-media{order:2}:root[dir="rtl"] .gift .gift-media{order:2}}
.gift-media{position:relative;aspect-ratio:16/11;overflow:hidden;--c:26px}
.gift-media img{width:100%;height:100%;object-fit:cover}
.gift h2{font-size:clamp(34px,4.2vw,60px);margin-block:18px 22px}
:root[lang="ar"] .gift h2{font-size:clamp(28px,3.4vw,48px)}
.engr{margin-top:34px;display:grid;gap:14px;max-width:460px}
.engr label{font-size:10.5px;letter-spacing:var(--track);text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .engr label{font-size:12.5px}
.engr-band{position:relative;height:84px;background:var(--green);display:grid;place-items:center;overflow:hidden;--c:10px}
.engr-band::before{content:"";position:absolute;inset:10px;border:1px solid rgba(182,146,98,.35)}
.engr-out{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:30px;line-height:1;padding-inline:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
:root[lang="ar"] .engr-out{font-family:var(--f-ar);font-style:normal;font-weight:300;font-size:26px}
.field{width:100%;min-height:50px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0;font-size:16px;font-weight:300;border-radius:0;outline:none;transition:border-color .3s}
.field:focus{border-bottom-color:var(--gold-light)}
.dark .field{border-bottom-color:var(--line-dark)}
.dark .field:focus{border-bottom-color:var(--gold-light)}

/* house */
.house{color:var(--on-dark);background:var(--green-deep)}
.house-media{position:relative;height:clamp(420px,62vw,760px);overflow:hidden}
.house-media img{width:100%;height:100%;object-fit:cover;object-position:center 60%}
.house-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,32,26,.95),rgba(15,32,26,.15) 55%,rgba(15,32,26,0))}
.house-copy{position:absolute;inset-inline:0;bottom:0;z-index:1;padding-block:0 clamp(36px,6vw,80px)}
.house-copy h2{font-size:clamp(34px,4.6vw,68px);margin-block:16px 18px}
:root[lang="ar"] .house-copy h2{font-size:clamp(28px,3.6vw,54px)}
.house-copy p{max-width:52ch;margin-bottom:30px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(242,212,142,.5);color:var(--gold-light);padding:6px 12px;font-size:10px;letter-spacing:var(--track);text-transform:uppercase}
:root[lang="ar"] .badge{font-size:12px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold-light);animation:pulse 2.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- footer ---------- */
.ftr{background:var(--ivory);color:var(--on-dark);padding-block:clamp(56px,7vw,96px) 28px;overflow:hidden;border-top:1px solid var(--line)}
.ftr-top{display:grid;gap:48px}
@media (min-width:900px){.ftr-top{grid-template-columns:1.3fr 2fr}}
.ftr h2{font-size:clamp(30px,3.4vw,46px);margin-bottom:10px}
.news{display:flex;gap:12px;margin-top:26px;max-width:460px}
.news .field{flex:1;min-width:0}
.ftr-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:32px}
.ftr-cols h4{font-size:10.5px;letter-spacing:var(--track);text-transform:uppercase;color:var(--gold);margin-bottom:16px;font-weight:400}
:root[lang="ar"] .ftr-cols h4{font-size:13px}
.ftr-cols ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ftr-cols a,.ftr-cols button{color:var(--on-dark-muted);transition:color .3s;text-align:start}
.ftr-cols a:hover,.ftr-cols button:hover{color:var(--on-dark)}
.ftr-wm{margin-block:clamp(56px,8vw,110px) 28px;width:100%;color:var(--gold)}
.ftr-wm .wm{width:100%;height:auto}
.ftr-bot{display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:center;border-top:1px solid var(--line-dark);padding-top:22px;font-size:12.5px;color:var(--on-dark-muted)}
.ftr-bot .row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.sel{appearance:none;background:transparent;border:1px solid var(--line-dark);color:var(--on-dark);padding:8px 34px 8px 12px;font-size:12.5px;border-radius:0;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
:root[dir="rtl"] .sel{padding:8px 12px 8px 34px;background-position:16px 52%,11px 52%}
.sel option,select option{background:#0e1d17;color:#c9a66e}
.lang-btn{border:1px solid var(--line-dark);padding:8px 14px;color:var(--on-dark)}

/* ---------- shop ---------- */
.page-head{padding-block:clamp(48px,7vw,96px) clamp(28px,4vw,48px)}
.crumbs{display:flex;gap:10px;font-size:11px;letter-spacing:var(--track);text-transform:uppercase;color:var(--muted);margin-bottom:28px;flex-wrap:wrap}
:root[lang="ar"] .crumbs{font-size:13px}
.crumbs a:hover{color:var(--ink)}
.page-head h1{font-size:clamp(44px,6vw,92px)}
:root[lang="ar"] .page-head h1{font-size:clamp(36px,4.6vw,70px)}
.page-head p{max-width:56ch;margin-top:18px;color:var(--muted);font-size:16px}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:20;background:rgba(14,29,23,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-block:1px solid var(--line);margin-bottom:clamp(28px,4vw,48px)}
.toolbar .wrap{display:flex;align-items:center;gap:20px;min-height:60px;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 16px;border:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;transition:all .3s;white-space:nowrap}
:root[lang="ar"] .chip{font-size:13px}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"],.chip.on{background:rgba(201,166,110,.14);color:var(--ink);border-color:var(--ink)}
.tb-r{display:flex;align-items:center;gap:16px;flex:none}
.tb-count{font-size:12px;color:var(--muted);display:none;white-space:nowrap}
@media (min-width:760px){.tb-count{display:inline}}
.sort{appearance:none;border:0;background:transparent;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-inline-end:18px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 6px) 55%,calc(100% - 1px) 55%;background-size:5px 5px;background-repeat:no-repeat;min-height:40px}
:root[dir="rtl"] .sort{background-position:6px 55%,1px 55%;padding-inline-end:0;padding-inline-start:18px}
:root[lang="ar"] .sort{font-size:13px}
.empty{padding-block:80px;text-align:center;color:var(--muted);display:grid;gap:24px;justify-items:center}
.empty .mk{width:56px;color:var(--gold)}

/* ---------- product ---------- */
.pdp{display:grid;gap:clamp(28px,4vw,72px);padding-block:clamp(16px,3vw,40px) clamp(64px,8vw,120px)}
@media (min-width:960px){.pdp{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * var(--gutter))}
.gal::-webkit-scrollbar{display:none}
.gal figure{margin:0;scroll-snap-align:center;aspect-ratio:4/5;background:var(--stone);overflow:hidden;position:relative}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figure.lume{max-width:none;aspect-ratio:4/5;cursor:crosshair;touch-action:auto}
.gal .frame::before{display:none}
.gal-count{display:flex;justify-content:center;gap:8px;margin-top:14px}
.gal-count i{width:22px;height:1px;background:var(--line);transition:background .3s,width .3s}
.gal-count i.on{background:var(--gold-light);width:36px}
@media (min-width:960px){
  .gal{grid-auto-flow:row;grid-template-columns:1fr 1fr;grid-auto-columns:auto;overflow:visible;margin:0;gap:12px}
  .gal figure:first-child{grid-column:1/-1}
  .gal-count{display:none}
}
.info{display:grid;gap:26px;min-width:0}
@media (min-width:960px){.info{position:sticky;top:calc(var(--hh) + 32px)}}
.info h1{font-size:clamp(36px,3.8vw,56px)}
:root[lang="ar"] .info h1{font-size:clamp(28px,2.8vw,42px)}
.info .price{font-size:16px;color:var(--ink)}
.info .story{color:var(--muted);font-size:16px;max-width:52ch}
.opt-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.opt-h span{font-size:10.5px;letter-spacing:var(--track);text-transform:uppercase}
:root[lang="ar"] .opt-h span{font-size:13px}
.opt-h button{font-size:12px;text-decoration:underline;text-underline-offset:4px;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes .chip{min-width:52px;justify-content:center;font-variant-numeric:tabular-nums}
.err{color:#e6a08c;font-size:12.5px;margin-top:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;border-block:1px solid var(--line);cursor:pointer}
.toggle input{appearance:none;width:40px;height:22px;border-radius:22px;background:var(--stone);position:relative;cursor:pointer;transition:background .3s;flex:none;border:1px solid var(--line)}
.toggle input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .3s var(--ease)}
.toggle input:checked{background:var(--gold)}
.toggle input:checked::after{inset-inline-start:20px}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.sq{width:56px;min-height:52px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold-light)}
.sq svg{width:20px;height:20px;stroke:currentColor;fill:transparent;stroke-width:1.2}
.sq[aria-pressed="true"] svg{fill:var(--gold-light)}
.assure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-block:1px solid var(--line);padding-block:18px}
.assure div{display:grid;gap:8px;justify-items:center;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.4}
.assure svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.1}
details{border-bottom:1px solid var(--line)}
details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:58px;cursor:pointer;font-size:11px;letter-spacing:var(--track);text-transform:uppercase}
:root[lang="ar"] details summary{font-size:13.5px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:18px;font-weight:300;transition:rotate .3s}
details[open] summary::after{rotate:45deg}
details .body{padding-bottom:22px;color:var(--muted);display:grid;gap:10px}
details dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
details dt{color:var(--ink)}
details dd{margin:0}
.ask{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ask button{text-decoration:underline;text-underline-offset:4px;color:var(--ink)}
.sticky-buy{position:fixed;inset-inline:0;bottom:0;z-index:30;background:rgba(14,29,23,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;transform:translateY(110%);transition:transform .5s var(--ease)}
.sticky-buy.show{transform:none}
.sticky-buy .nm{flex:1;min-width:0;font-family:var(--f-display);font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticky-buy .nm small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.sticky-buy .btn{min-height:46px;padding:0 20px}
@media (min-width:960px){.sticky-buy{display:none}}

/* ---------- story ---------- */
.story-hero{display:grid;gap:clamp(32px,5vw,80px);align-items:center;padding-block:clamp(48px,7vw,110px)}
@media (min-width:900px){.story-hero{grid-template-columns:1fr 1fr}}
.story-hero h1{font-size:clamp(44px,6vw,96px);margin-block:18px 26px}
:root[lang="ar"] .story-hero h1{font-size:clamp(34px,4.6vw,72px)}
.story-hero p{max-width:54ch;color:var(--muted);font-size:16px;margin-bottom:14px}
.story-hero .media{aspect-ratio:4/5;overflow:hidden;--c:28px}
.story-hero img{width:100%;height:100%;object-fit:cover}
.mark-sec .wrap{display:grid;gap:clamp(40px,6vw,96px);align-items:center}
@media (min-width:900px){.mark-sec .wrap{grid-template-columns:.9fr 1.1fr}}
.big-mark{width:min(380px,70%);margin-inline:auto}
.points{display:grid;gap:0;border-top:1px solid var(--line-dark)}
.points>div{display:grid;grid-template-columns:44px 1fr;gap:18px;padding-block:26px;border-bottom:1px solid var(--line-dark)}
.points b{font-weight:400;font-size:11px;letter-spacing:var(--track);color:var(--gold);font-variant-numeric:tabular-nums;padding-top:6px}
.points h3{font-family:var(--f-display);font-size:clamp(24px,2.4vw,32px);margin-bottom:6px}
:root[lang="ar"] .points h3{font-size:clamp(20px,1.8vw,24px)}
.quote{text-align:center}
.quote h2{font-size:clamp(34px,4.8vw,72px);max-width:20ch;margin:20px auto 26px}
:root[lang="ar"] .quote h2{font-size:clamp(28px,3.8vw,56px)}
.quote p{max-width:58ch;margin-inline:auto;color:var(--muted);font-size:16px}

/* ---------- checkout ---------- */
.co{display:grid;gap:clamp(32px,5vw,72px);padding-block:clamp(32px,5vw,72px) clamp(64px,8vw,120px)}
@media (min-width:960px){.co{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.co h1{font-size:clamp(40px,5vw,72px);margin-bottom:8px}
.co fieldset{border:0;padding:0;margin:0 0 44px;display:grid;gap:18px;min-width:0}
.co legend{font-size:11px;letter-spacing:var(--track);text-transform:uppercase;color:var(--gold);margin-bottom:6px;padding:0;display:flex;gap:12px;align-items:center}
:root[lang="ar"] .co legend{font-size:13.5px}
.co legend b{font-weight:400;color:var(--muted)}
.two{display:grid;gap:18px}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.lbl{display:grid;gap:2px;min-width:0}
.lbl span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .lbl span{font-size:12.5px}
select.field{appearance:none}
.express{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-x{min-height:52px;display:grid;place-items:center;font-weight:500;font-size:16px;letter-spacing:.02em;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.pay-x.apple{background:#000;color:#ece6d8;border:1px solid var(--line)}
.pay-x.knet{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:700;letter-spacing:.08em}
.or{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;margin-block:6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.radios{display:grid;gap:8px}
.radio{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);cursor:pointer;transition:border-color .3s}
.radio:has(input:checked){border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.radio input{accent-color:var(--gold);width:18px;height:18px;margin:0}
.radio small{margin-inline-start:auto;color:var(--muted)}
.slots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.slot{flex:none;display:grid;text-align:center;border:1px solid var(--line);padding:10px 14px;cursor:pointer;min-width:74px;transition:all .3s}
.slot input{position:absolute;opacity:0;pointer-events:none}
.slot b{font-weight:400;font-family:var(--f-display);font-size:22px;line-height:1.1}
:root[lang="ar"] .slot b{font-family:var(--f-ar);font-size:18px}
.slot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.slot:has(input:checked){background:rgba(201,166,110,.14);color:var(--ink);border-color:var(--ink)}
.slot:has(input:checked) span{color:var(--muted)}
.summary{background:var(--stone);padding:clamp(22px,3vw,36px);display:grid;gap:18px;--c:16px}
@media (min-width:960px){.summary{position:sticky;top:calc(var(--hh) + 24px)}}
.summary h2{font-family:var(--f-display);font-size:28px}
.li{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center}
.li img{width:72px;aspect-ratio:4/5;object-fit:cover}
.li h4{font-family:var(--f-display);font-size:18px;font-weight:400;line-height:1.2}
:root[lang="ar"] .li h4{font-size:15px}
.li small{display:block;color:var(--muted);font-size:12px}
.tot{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .grand{font-size:18px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.note{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.thanks{text-align:center;padding-block:clamp(80px,12vw,180px);display:grid;justify-items:center;gap:22px}
.thanks .mk{width:70px}
.thanks h1{font-size:clamp(44px,6vw,92px)}
.thanks p{max-width:52ch;color:var(--muted);font-size:16px}
.ord{font-variant-numeric:tabular-nums;letter-spacing:.12em;border:1px solid var(--line);padding:10px 18px;font-size:13px}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:var(--ivory);color:var(--ink);max-width:100%;max-height:100%}
dialog::backdrop{background:rgba(15,32,26,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.drawer{position:fixed;margin:0;inset-block:0;inset-inline-end:0;inset-inline-start:auto;height:100%;width:min(460px,100%);display:flex;flex-direction:column;transition:transform .55s var(--ease),overlay .55s allow-discrete,display .55s allow-discrete;transform:translateX(100%)}
:root[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer[open]{transform:none!important}
@starting-style{.drawer[open]{transform:translateX(100%)!important}:root[dir="rtl"] .drawer[open]{transform:translateX(-100%)!important}}
.drawer.start{inset-inline-start:0;inset-inline-end:auto;transform:translateX(-100%)}
:root[dir="rtl"] .drawer.start{transform:translateX(100%)}
@starting-style{.drawer.start[open]{transform:translateX(-100%)!important}:root[dir="rtl"] .drawer.start[open]{transform:translateX(100%)!important}}
.drawer.dark{background:var(--green);color:var(--on-dark)}
dialog::backdrop{transition:opacity .5s,overlay .5s allow-discrete,display .5s allow-discrete;opacity:0}
dialog[open]::backdrop{opacity:1}
@starting-style{dialog[open]::backdrop{opacity:0}}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 18px;border-bottom:1px solid var(--line)}
.dark .d-head{border-bottom-color:var(--line-dark)}
.d-head h2{font-family:var(--f-display);font-size:28px}
:root[lang="ar"] .d-head h2{font-size:22px}
.x{width:44px;height:44px;display:grid;place-items:center;margin-inline-end:-10px}
.d-body{flex:1;overflow:auto;padding:24px;overscroll-behavior:contain}
.d-foot{padding:20px 24px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:14px}
.bag-item{display:grid;grid-template-columns:88px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.bag-item img{width:88px;aspect-ratio:4/5;object-fit:cover;background:var(--stone)}
.bag-item h3{font-family:var(--f-display);font-size:20px;font-weight:400;line-height:1.2}
:root[lang="ar"] .bag-item h3{font-size:16px}
.bag-item small{display:block;color:var(--muted);font-size:12.5px}
.bag-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}

/* intro */
#intro{position:fixed;inset:0;z-index:200;background:var(--green-deep);display:grid;place-items:center;clip-path:inset(0 0 0 0);transition:clip-path 1.1s var(--ease)}

#intro .bar{position:absolute;bottom:22%;width:140px;height:1px;background:var(--line);overflow:hidden}

/* cursor */
.cur{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:1px solid rgba(242,212,142,.6);border-radius:50%;pointer-events:none;z-index:150;display:grid;place-items:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--green-deep);transition:width .4s var(--ease),height .4s var(--ease),margin .4s var(--ease),background .4s,border-color .4s}

.cur-dot{position:fixed;left:0;top:0;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--gold-light);pointer-events:none;z-index:151}

.marq{overflow:hidden;border-block:1px solid var(--line);padding-block:clamp(20px,3vw,36px);white-space:nowrap;direction:ltr}

.marq span{font-family:var(--f-display);font-size:clamp(42px,7.5vw,120px);font-weight:300;line-height:1.15;color:transparent;-webkit-text-stroke:1px rgba(242,212,142,.55);display:inline-flex;align-items:center;gap:.45em;padding-inline-end:.45em}

/* manifesto words */
.manifesto h2 .wd{opacity:.2;transition:opacity .5s var(--ease)}
.manifesto h2 .wd.on{opacity:1}

/* pinned horizontal collections */
.hs{position:relative}
.hs-sticky{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;align-items:center}
.hs-track{display:flex;align-items:center;gap:clamp(20px,3vw,56px);padding-inline:var(--gutter);will-change:transform}

/* lume entrance */

}}

/* scroll cue */
.cue{position:absolute;bottom:28px;left:50%;translate:-50% 0;width:1px;height:56px;background:var(--line-dark);overflow:hidden;display:none}

/* diamond choice */
.dia{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* view transitions */
::view-transition-old(root){animation:vtOut .9s var(--ease) both}
::view-transition-new(root){animation:vtIn .9s var(--ease) both}
@keyframes vtOut{to{opacity:.35;transform:scale(.96)}}
@keyframes vtIn{from{clip-path:circle(0 at var(--vx,50%) var(--vy,50%))}to{clip-path:circle(150% at var(--vx,50%) var(--vy,50%))}}
::view-transition-group(piece){animation-duration:.75s;animation-timing-function:var(--ease)}
::view-transition-old(hdr),::view-transition-new(hdr){animation:none}
.hdr{view-transition-name:hdr}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------------- api ---------------- */
async function api(path,{method="GET",body,form}={}){
  const h={"X-Requested-With":"fetch"};let payload;
  if(form)payload=form;else if(body!==undefined){h["Content-Type"]="application/json";payload=JSON.stringify(body)}
  let r;
  try{r=await fetch("/api"+path,{method,headers:h,body:payload,credentials:"same-origin"})}
  catch(e){throw new Error(S.lang==="ar"?"تعذّر الاتصال بالخادم. حاولي مرة أخرى.":"Could not reach the server. Please try again.")}
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok){const er=new Error((data&&data.error)||(S.lang==="ar"?"حدث خطأ ما.":"Something went wrong."));er.status=r.status;er.code=data&&data.code;throw er}
  return data;
}
const isoDay=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const kindOf=p=>CATS[p.cat]?.sizeKind||null;
const unitCm=p=>kindOf(p)==="length"?" "+t("cm"):"";
async function loadCatalog(){
  const c=await api("/catalog");
  RATES=c.rates;COLS=c.cols;CATS=c.cats;P=c.products;
  const ok=new Set(P.map(p=>p.id));
  S.bag=S.bag.filter(b=>ok.has(b.id));store.set("bag",S.bag);
  S.wish=S.wish.filter(id=>ok.has(id));store.set("wish",S.wish);
}
async function loadUser(){
  try{S.user=(await api("/auth/me")).user}catch(e){S.user=null}
  if(S.user)await syncWish();
}
async function syncWish(){
  try{const r=await api("/me/wishlist",{method:"PUT",body:{ids:S.wish}});const ok=new Set(P.map(p=>p.id));S.wish=r.ids.filter(id=>ok.has(id));store.set("wish",S.wish)}catch(e){}
}

let cleanups=[],scrollFns=[];
function parse(){
  const h=decodeURIComponent(location.hash.slice(1))||"home";

  if(h==="shop")return{v:"shop",cat:"all",col:"all"};
  if(h.startsWith("shop-"))return{v:"shop",cat:h.slice(5),col:"all"};
  if(h.startsWith("c-"))return{v:"shop",cat:"all",col:h.slice(2)};
  if(h.startsWith("p-"))return{v:"product",id:h.slice(2)};
  if(["story","wishlist","checkout","thanks","terms","privacy","bespoke","account"].includes(h))return{v:h};

/* hero sparkle: glints that live on the canvas and follow the pointer */
function sparkle(cv){
  if(reduce)return()=>{};
  const ctx=cv.getContext("2d"),host=cv.closest(".hero");let W,H,dpr,raf,parts=[],mx=-1,my=-1,alive=true;
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  size();const ro=new ResizeObserver(size);ro.observe(cv);
  const spawn=(x,y,big)=>parts.push({x,y,r:big?(5+Math.random()*7):(2+Math.random()*4),life:0,max:60+Math.random()*90,rot:Math.random()*Math.PI,vy:-.08-Math.random()*.15});
  const mv=e=>{const b=cv.getBoundingClientRect();mx=e.clientX-b.left;my=e.clientY-b.top;if(Math.random()<.35)spawn(mx+(Math.random()-.5)*40,my+(Math.random()-.5)*40,false)};
  host.addEventListener("pointermove",mv);
  const star=(p)=>{const k=Math.max(0,Math.sin(Math.PI*Math.min(p.life,p.max)/p.max)),r=Math.max(.01,p.r*k);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=k*.9;
    const g=ctx.createRadialGradient(0,0,0,0,0,r*2.2);g.addColorStop(0,"rgba(255,246,220,.9)");g.addColorStop(1,"rgba(242,212,142,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.2,0,7);ctx.fill();
    ctx.fillStyle="#fff7e2";ctx.beginPath();ctx.moveTo(0,-r*2.4);ctx.quadraticCurveTo(r*.18,-r*.18,r*2.4,0);ctx.quadraticCurveTo(r*.18,r*.18,0,r*2.4);ctx.quadraticCurveTo(-r*.18,r*.18,-r*2.4,0);ctx.quadraticCurveTo(-r*.18,-r*.18,0,-r*2.4);ctx.fill();ctx.restore()};
  const loop=()=>{if(!alive)return;ctx.clearRect(0,0,W,H);
    if(parts.length<12&&Math.random()<.045){const rtl=document.documentElement.dir==="rtl";const x=W>900?(rtl?W*(.18+Math.random()*.4):W*(.42+Math.random()*.4)):W*Math.random();spawn(x,H*(.15+Math.random()*.6),Math.random()<.25)}
    parts=parts.filter(p=>(p.life++<p.max));parts.forEach(p=>{p.y+=p.vy;p.rot+=.004;star(p)});raf=requestAnimationFrame(loop)};
  const vis=new IntersectionObserver(([e])=>{cancelAnimationFrame(raf);if(e.isIntersecting)loop()});vis.observe(cv);
  return()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect();vis.disconnect();host.removeEventListener("pointermove",mv)};
}
/* light play over a stone */
function lume(el){
  const mv=e=>{const b=el.getBoundingClientRect();el.classList.remove("idle");el.style.setProperty("--mx",((e.clientX-b.left)/b.width*100).toFixed(1)+"%");el.style.setProperty("--my",((e.clientY-b.top)/b.height*100).toFixed(1)+"%")};
  const lv=()=>{el.style.removeProperty("--mx");el.style.removeProperty("--my");if(!reduce)el.classList.add("idle")};
  el.addEventListener("pointermove",mv);el.addEventListener("pointerleave",lv);
  if(reduce)el.classList.remove("idle");
  return()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerleave",lv)};
}
/* subtle 3D tilt on cards (fine pointers only) */
function tilt(c){
  if(!fine||reduce)return;const m=c.querySelector(".card-media");
  c.addEventListener("pointermove",e=>{const b=m.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;m.style.transform=`perspective(900px) rotateY(${(x-.5)*5}deg) rotateX(${(.5-y)*5}deg)`;m.style.setProperty("--gx",x*100+"%");m.style.setProperty("--gy",y*100+"%")});
  c.addEventListener("pointerleave",()=>{m.style.transform=""});
}

/* pinned horizontal gallery */
function hscroll(sec){
  const track=sec.querySelector(".hs-track"),bar=sec.querySelector("#hs-bar"),imgs=[...sec.querySelectorAll(".hs-panel img")];
  if(reduce){sec.classList.add("static");return()=>{}}
  let dist=0;
  const upd=()=>{const span=Math.max(1,sec.offsetHeight-innerHeight);const p=Math.min(1,Math.max(0,-sec.getBoundingClientRect().top/span));const rtl=document.documentElement.dir==="rtl";
    track.style.transform=`translate3d(${(rtl?1:-1)*dist*p}px,0,0)`;bar.style.setProperty("--p",p.toFixed(4));
    imgs.forEach(im=>{const b=im.parentElement.getBoundingClientRect();const k=(b.left+b.width/2-innerWidth/2)/innerWidth;im.style.translate=`${(k*-7).toFixed(2)}% 0`})};
  const size=()=>{const prev=track.style.transform;track.style.transform="none";const last=track.lastElementChild.getBoundingClientRect(),g=parseFloat(getComputedStyle(track).paddingInlineStart)||16;
    dist=Math.max(0,document.documentElement.dir==="rtl"?(g-last.left):(last.right-(innerWidth-g)));track.style.transform=prev;sec.style.height=(innerHeight+dist)+"px";upd()};
  size();const ro=new ResizeObserver(size);ro.observe(track);scrollFns.push(upd);
  return()=>ro.disconnect();

/* marquee that speeds up with scroll velocity */
function marquee(tr){
  if(reduce)return()=>{};
  let rate=1,last=scrollY,alive=true,raf;
  const loop=()=>{if(!alive)return;const v=Math.abs(scrollY-last);last=scrollY;const target=1+Math.min(v*.3,8);rate+=(target-rate)*.07;const an=tr.getAnimations()[0];if(an)an.playbackRate=rate;raf=requestAnimationFrame(loop)};
  loop();return()=>{alive=false;cancelAnimationFrame(raf)};
}
