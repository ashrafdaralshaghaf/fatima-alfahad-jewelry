# One-click blueprint for https://render.com  (New + > Blueprint > pick this repo)
services:
  - type: web
    name: fatima-alfahad
    runtime: docker
    plan: starter            # a paid plan is required for the persistent disk below
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data       # product photos + private bespoke photos survive redeploys
      sizeGB: 5
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: UPLOADS_DIR, value: /data/uploads }
      - { key: PRIVATE_DIR, value: /data/private }
      - { key: DATABASE_SSL, value: "false" }   # internal Render connection
      - { key: DATABASE_URL, fromDatabase: { name: fatima-db, property: connectionString } }
      - { key: APP_SECRET, generateValue: true }
      - { key: PUBLIC_URL, sync: false }        # e.g. https://www.your-domain.com
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: ORDER_NOTIFY_EMAIL, sync: false }
databases:
  - name: fatima-db
    plan: basic-256mb
